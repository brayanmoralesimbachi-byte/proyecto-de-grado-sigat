<div class="register-container">
  <button class="btn-back" (click)="goHome()">
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor">
      <path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/>
    </svg>
    Volver
  </button>
  <div class="register-card">
    <div class="register-header">
      <div class="logo-icon">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor">
          <path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/>
        </svg>
      </div>
      <h1>Crear Cuenta</h1>
      <p>Complete el formulario para registrarse</p>
    </div>

    <form (ngSubmit)="onRegister()" class="register-form">
      <div class="form-group">
        <label for="username">Usuario</label>
        <input
          type="text"
          id="username"
          [value]="username()"
          (input)="username.set($any($event.target).value)"
          [disabled]="isLoading()"
          placeholder="Ingrese un nombre de usuario"
          required
        />
        <small>Mínimo 3 caracteres</small>
      </div>

      <div class="form-group">
        <label for="password">Contraseña</label>
        <input
          type="password"
          id="password"
          [value]="password()"
          (input)="password.set($any($event.target).value)"
          [disabled]="isLoading()"
          placeholder="Ingrese una contraseña segura"
          required
        />
        <small>Mínimo 6 caracteres, una mayúscula y un número</small>
      </div>

      <div class="form-group">
        <label for="confirmPassword">Confirmar Contraseña</label>
        <input
          type="password"
          id="confirmPassword"
          [value]="confirmPassword()"
          (input)="confirmPassword.set($any($event.target).value)"
          [disabled]="isLoading()"
          placeholder="Repita la contraseña"
          required
        />
      </div>

      @if (errorMessage()) {
        <div class="error-message">
          {{ errorMessage() }}
        </div>
      }

      @if (successMessage()) {
        <div class="success-message">
          {{ successMessage() }}
          <br>
          Redirigiendo al login...
        </div>
      }

      <button
        type="submit"
        class="register-button"
        [disabled]="isLoading()"
      >
        @if (isLoading()) {
          <span>Registrando...</span>
        } @else {
          <span>Registrar Usuario</span>
        }
      </button>

      <div class="login-link">
        <p>¿Ya tienes cuenta? <a (click)="goToLogin()">Iniciar Sesión</a></p>
      </div>
    </form>

  </div>
</div>
